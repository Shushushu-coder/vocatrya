services:
  app:
    image: ghcr.io/gsync/jobsync:latest
    container_name: jobsync_app
    ports:
      - "3737:3737"
    environment:
      - NODE_ENV=production
      - MCP_ENABLED=${MCP_ENABLED:-true}
      # ${VAR-sentinel} substitutes only when the host variable is unset.
      # The entrypoint removes the sentinel so the container key is absent.
      # An explicit empty value stays empty and fails closed. Do not use :-false/:-none.
      - VOCATRYA_AB_RUNTIME_ENABLED=${VOCATRYA_AB_RUNTIME_ENABLED-__VOCATRYA_AB_UNSET__}
      - VOCATRYA_AB_ROLLOUT_SCOPE=${VOCATRYA_AB_ROLLOUT_SCOPE-__VOCATRYA_AB_UNSET__}
      - DATABASE_URL=file:/data/dev.db
      - AUTH_SECRET=${AUTH_SECRET:-your-auth-secret}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-you-encryption-key-here}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3737}
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST:-true}
      - TZ=${TZ:-America/Edmonton}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - RAPIDAPI_KEY=${RAPIDAPI_KEY:-}
    volumes:
      - ./jobsyncdb/data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3737"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
